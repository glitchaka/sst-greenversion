name: SST Green · Windows compilation

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "assets/branding/**"
      - "assets/fonts/**"
      - ".github/workflows/green-ci.yml"
      - ".github/workflows/green-preview.yml"
  workflow_dispatch:
permissions:
  contents: read

# Only the newest Green source revision needs a Windows validation run.
concurrency:
  group: sst-green-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-check:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      # Compile-only test input: pinned third-party mirror of the official
      # IEEE registries. This CI job never publishes executables or datasets.
      SST_IEEE_MAL_CSV: ${{ github.workspace }}/.ci-ieee/oui.csv
      SST_IEEE_MAM_CSV: ${{ github.workspace }}/.ci-ieee/mam.csv
      SST_IEEE_MAS_CSV: ${{ github.workspace }}/.ci-ieee/oui36.csv
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned IEEE mirror for compile-only verification
        uses: actions/checkout@v4
        with:
          repository: StewAlexander-com/maclookup.py
          ref: 65f556005f63a22ae353e6f129440dbdb3c29c06
          path: .ci-ieee
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify custom SST TrueType with Windows font engine
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $face = New-Object System.Drawing.Text.PrivateFontCollection
          try {
            $file = (Resolve-Path "assets/fonts/SSTIndustrial-Regular.ttf").Path
            $face.AddFontFile($file)
            if (-not ($face.Families | Where-Object Name -eq "SST Industrial")) {
              throw "Windows did not load the SST Industrial TrueType family."
            }
            Write-Host "Windows accepted the SST Industrial TTF."
          } finally { $face.Dispose() }
      - name: Check Windows Rust project
        run: cargo check --locked
      - name: Compile regression tests (without executing privileged operations)
        run: cargo test --locked --no-run
